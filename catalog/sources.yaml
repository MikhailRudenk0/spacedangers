# spacedangers — catalog of parsable internet sources for space-hazard data.
#
# Every entry is machine-verified by tools/verify.py, which issues the real
# HTTP request described under `endpoints` and checks the response against
# `expect`. Ranking is computed by tools/rank.py from the fields below plus
# the measured verification result. Nothing here is scored by hand.
#
# Field reference
#   auth:       none | demo_key | free_key | account | paid
#   formats:    json | csv | text | xml | html | binary
#   cadence:    realtime | minutes | hourly | daily | weekly | irregular
#   depth:      decades | years | months | realtime_only
#   relevance:  warning   (tells you a hazard is happening / will happen)
#               driver    (physical quantity that causes hazards)
#               tail_risk (a real warning feed, but for events whose occurrence
#                          rate is negligible on operational timescales)
#               catalog   (reference data you need to compute a hazard)
#   uniqueness: sole | few | many
#   query_raw:  appended to the URL verbatim, for services like LaTiS whose
#               query syntax is a bare expression rather than key=value pairs
#   expect:     status      - required HTTP status (default 200)
#               json_keys   - top-level JSON keys that must exist
#               min_items   - {path: dotted.path, n: N} list length check
#               contains    - substrings that must appear in the body
#               min_bytes   - minimum decoded body size
#   creds_env:  env vars that must be set for an authenticated probe; when
#               absent the probe is reported as `skipped` and the source is
#               scored on its unauthenticated liveness probe instead.

version: 1

scoring:
  weights:
    liveness: 25      # measured: did every probe pass?
    access: 15        # how much friction before you get a byte
    parseability: 12  # structured formats beat HTML scraping
    relevance: 20     # warning > driver > catalog
    cadence: 12       # how fresh the data is
    depth: 8          # how far back the archive goes
    uniqueness: 8     # can you get this anywhere else?
  access_points:   {none: 15, demo_key: 11, free_key: 8, account: 4, paid: 0}
  parse_points:    {json: 12, csv: 11, xml: 10, text: 8, binary: 6, html: 4}
  relevance_points: {warning: 20, driver: 14, tail_risk: 10, catalog: 8}
  cadence_points:  {realtime: 12, minutes: 12, hourly: 10, daily: 8, weekly: 5, irregular: 3}
  depth_points:    {decades: 8, years: 6, months: 3, realtime_only: 1}
  uniqueness_points: {sole: 8, few: 5, many: 2}

sources:

  # ---------------------------------------------------------------- NEO / impact

  - id: jpl_ssd_cneos
    name: NASA/JPL Solar System Dynamics & CNEOS API
    org: NASA Jet Propulsion Laboratory
    homepage: https://ssd-api.jpl.nasa.gov/doc/
    domains: [neo_impact, fireballs, orbits]
    auth: none
    formats: [json]
    cadence: daily
    depth: decades
    relevance: warning
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      The authoritative machine-readable feed for asteroid and comet hazard.
      Four distinct products behind one host:
      * Close-Approach Data (CAD): every known close approach of an asteroid or
        comet to Earth (or any planet) between 1900 and 2200 — date, nominal and
        minimum distance in au / lunar distances, relative velocity, absolute
        magnitude H, and the 3-sigma uncertainty on time of approach.
      * Sentry: the impact-risk table. Per object: number of potential impacts,
        impact probability, year range, Palermo and Torino scale ratings,
        estimated diameter and impact energy in megatons.
      * Fireball: energy and location of atmospheric bolide detections by US
        government sensors since 1988 — date, lat/lon, altitude, velocity vector,
        total radiated energy and computed impact energy.
      * SBDB / SBDB Query: full orbital elements, covariance, physical parameters
        (diameter, albedo, rotation, spectral type) and discovery circumstances
        for ~1.4M small bodies; the query endpoint does server-side filtering so
        you can pull "all PHAs with H < 22" in one request.
    endpoints:
      - id: cad
        name: Close-approach data (next 60 days, inside 0.05 au)
        url: https://ssd-api.jpl.nasa.gov/cad.api
        params: {date-min: now, date-max: "+60", dist-max: "0.05", sort: dist, limit: "20"}
        expect: {json_keys: [signature, count, fields, data]}
        provides: des, orbit_id, jd, cd, dist, dist_min, dist_max, v_rel, v_inf, t_sigma_f, h
      - id: sentry
        name: Impact-risk table (Palermo scale >= -5)
        url: https://ssd-api.jpl.nasa.gov/sentry.api
        params: {"ps-min": "-5"}
        expect: {json_keys: [signature, count, data]}
        provides: des, ip (impact probability), ps_cum, ts_max, diameter, energy, last_obs, n_imp
      - id: fireball
        name: Bolide / fireball detections
        url: https://ssd-api.jpl.nasa.gov/fireball.api
        params: {limit: "10", sort: "-date"}
        expect: {json_keys: [signature, count, fields, data]}
        provides: date, lat, lon, alt, vel, energy (kt), impact-e
      - id: sbdb_query
        name: Bulk query — potentially hazardous asteroids
        url: https://ssd-api.jpl.nasa.gov/sbdb_query.api
        params: {fields: "full_name,H,diameter,moid,class", sb-group: pha, limit: "10"}
        expect: {json_keys: [signature, fields, data]}
        provides: any of ~200 orbital/physical columns, server-side filtered
      - id: scout
        name: Scout — imminent-impactor hazard assessment
        url: https://ssd-api.jpl.nasa.gov/scout.api
        expect: {json_keys: [signature, count]}
        provides: impact probability and geographic corridor for objects still on the MPC confirmation page

  - id: jpl_horizons
    name: NASA/JPL Horizons ephemeris API
    org: NASA Jet Propulsion Laboratory
    homepage: https://ssd-api.jpl.nasa.gov/doc/horizons.html
    domains: [orbits, neo_impact]
    auth: none
    formats: [json, text]
    cadence: daily
    depth: decades
    relevance: catalog
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      Numerically integrated ephemerides for any solar-system body, spacecraft or
      user-supplied orbit, as seen from any observing site. Used for turning a
      hazard catalogue entry into an actual sky position, range and range-rate:
      RA/Dec, apparent magnitude, Earth and Sun distance, phase angle, elongation,
      illumination, and state vectors in a chosen reference frame at arbitrary
      time steps. This is the ground truth other NEO products are checked against.
    endpoints:
      - id: observer
        name: Observer table for 99942 Apophis
        url: https://ssd.jpl.nasa.gov/api/horizons.api
        params:
          format: json
          COMMAND: "'99942'"
          OBJ_DATA: "'NO'"
          MAKE_EPHEM: "'YES'"
          EPHEM_TYPE: "'OBSERVER'"
          CENTER: "'500@399'"
          START_TIME: "'2026-01-01'"
          STOP_TIME: "'2026-01-02'"
          STEP_SIZE: "'1 d'"
        expect: {json_keys: [signature, result]}
        provides: date, RA, Dec, apparent magnitude, delta (Earth range), deldot, S-O-T elongation

  - id: nasa_neows
    name: NASA NeoWs (Near Earth Object Web Service)
    org: NASA / api.nasa.gov
    homepage: https://api.nasa.gov/
    domains: [neo_impact]
    auth: demo_key
    formats: [json]
    cadence: daily
    depth: decades
    relevance: warning
    uniqueness: many
    license: Public domain (US Government)
    provides: |
      A friendlier re-packaging of JPL SBDB/CAD keyed by date: "what passes close
      to Earth this week". Per object it returns estimated diameter min/max in
      four unit systems, the is_potentially_hazardous_asteroid flag, close-approach
      date, relative velocity, miss distance, the orbiting body, plus a browse
      endpoint over the whole ~40k NEO catalogue. Easier to consume than the raw
      JPL APIs but derived from them, rate-limited, and needs a key.
    creds_env: [NASA_API_KEY]
    endpoints:
      - id: feed
        name: Close approaches for a date range
        url: https://api.nasa.gov/neo/rest/v1/feed
        params: {start_date: "2026-09-01", end_date: "2026-09-03"}
        api_key_param: api_key
        expect: {json_keys: [element_count, near_earth_objects]}
        provides: element_count, near_earth_objects keyed by date, links for pagination
      - id: stats
        name: Catalogue statistics
        url: https://api.nasa.gov/neo/rest/v1/stats
        api_key_param: api_key
        expect: {json_keys: [near_earth_object_count, close_approach_count]}
        provides: total NEO count, total close-approach count, last updated, source

  - id: esa_neocc
    name: ESA NEO Coordination Centre
    org: European Space Agency
    homepage: https://neo.ssa.esa.int/
    domains: [neo_impact]
    auth: none
    formats: [text, html]
    cadence: daily
    depth: years
    relevance: warning
    uniqueness: few
    license: ESA public data
    provides: |
      Europe's independent impact-monitoring chain (AstOD/Aegis), computed
      separately from Sentry — valuable precisely because it is an independent
      check on JPL. Downloadable flat files give the Risk List (objects with a
      non-zero impact probability: designation, year range, impact probability,
      Palermo scale, diameter, velocity), the Priority List telling observers
      which objects urgently need follow-up astrometry, the Close Approaches
      list, and per-object orbital elements and observation arcs.
    endpoints:
      - id: all_neo
        name: Full NEA list (documented automated-data-access endpoint)
        url: https://neo.ssa.esa.int/PSDB-portlet/download
        params: {file: allneo.lst}
        expect: {min_bytes: 10000}
        provides: designation list of every NEA known to the NEOCC
      - id: risk_list
        name: Risk list (flat file)
        url: https://neo.ssa.esa.int/PSDB-portlet/download
        params: {file: esa_risk_list}
        expect: {min_bytes: 2000}
        provides: object, date, impact probability, Palermo scale, H, diameter, v_inf
      - id: priority_list
        name: Observation priority list
        url: https://neo.ssa.esa.int/PSDB-portlet/download
        params: {file: esa_priority_list}
        expect: {min_bytes: 500}
        provides: designation, priority, RA/Dec, V magnitude, observability window
      - id: close_approaches
        name: Upcoming close approaches
        url: https://neo.ssa.esa.int/PSDB-portlet/download
        params: {file: esa_upcoming_close_app}
        expect: {min_bytes: 500}
        provides: object, close-approach date, distance, v_rel, H

  - id: neodys
    name: NEODyS-2
    org: SpaceDyS / University of Pisa
    homepage: https://newton.spacedys.com/neodys/
    domains: [neo_impact]
    auth: none
    formats: [text, html]
    cadence: daily
    depth: decades
    relevance: warning
    uniqueness: few
    license: Free for scientific use
    provides: |
      The third independent impact-monitoring system (the original CLOMON2 line
      of work). Per NEO it publishes orbital elements with full covariance, the
      observation arc, residuals, ephemerides, close-approach tables, and the
      risk page listing virtual impactors with date, impact probability, Palermo
      and Torino values. Also serves the raw astrometric observation files, which
      lets you re-fit an orbit yourself rather than trusting a published one.
    endpoints:
      - id: risk_page
        name: Risk list
        url: https://newton.spacedys.com/neodys/index.php
        params: {pc: "4.1"}
        expect: {contains: ["Risk"], min_bytes: 2000}
        provides: designation, date, impact probability, Palermo, Torino, H, diameter

  - id: mpc
    name: IAU Minor Planet Center
    org: IAU / Smithsonian Astrophysical Observatory
    homepage: https://minorplanetcenter.net/
    domains: [neo_impact, orbits]
    auth: none
    formats: [json, text]
    cadence: hourly
    depth: decades
    relevance: catalog
    uniqueness: sole
    license: Free with attribution
    provides: |
      The single clearing house every other NEO product depends on: it receives
      raw astrometry from the world's telescopes, assigns designations, and
      publishes the orbit catalogue. For hazard work the important products are
      the NEA orbit files (orbital elements, H, arc length, number of oppositions,
      MOID), the NEO Confirmation Page listing brand-new unconfirmed objects that
      may be on an impacting trajectory, the daily orbit-update files, and the
      raw observation records in the ADES/obs80 formats. If an object is not here
      yet, no risk system knows about it.
    endpoints:
      - id: nea_orbits
        name: Near-Earth asteroid orbit file
        url: https://www.minorplanetcenter.net/Extended_Files/nea_extended.json.gz
        expect: {min_bytes: 100000}
        provides: designation, epoch, a, e, i, node, peri, M, H, G, arc, n_opp, MOID, orbit class
      - id: neocp
        name: NEO Confirmation Page (unconfirmed objects)
        url: https://www.minorplanetcenter.net/iau/NEO/neocp.txt
        expect: {status: 200}
        provides: temporary designation, discovery date, RA/Dec, V magnitude, motion, NEO score, n_obs
      - id: nea_mpcorb
        name: NEA orbits in MPCORB format
        url: https://www.minorplanetcenter.net/iau/MPCORB/NEA.txt
        expect: {min_bytes: 100000}
        provides: fixed-width MPCORB records — designation, H, G, epoch, M, peri, node, i, e, n, a, arc, n_obs, n_opp, rms

  # ------------------------------------------------------------- space weather

  - id: noaa_swpc
    name: NOAA Space Weather Prediction Center — services.swpc.noaa.gov
    org: NOAA / US National Weather Service
    homepage: https://www.swpc.noaa.gov/
    domains: [solar, geomagnetic, radiation, ionosphere]
    auth: none
    formats: [json, text]
    cadence: minutes
    depth: decades
    relevance: warning
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      The operational space-weather feed. No key, no rate limit, updates every
      1–5 minutes, and it carries both the raw measurements and the official
      warnings:
      * alerts.json — the actual issued Watches, Warnings and Alerts (geomagnetic
        storm G1–G5, radio blackout R1–R5, radiation storm S1–S5), with issue
        time and free-text product.
      * noaa-scales.json — current and 3-day forecast R/S/G scale values.
      * GOES X-ray flux (1-minute, 0.05–0.4 nm and 0.1–0.8 nm) — this is how you
        detect a solar flare and classify it A/B/C/M/X.
      * GOES integral proton flux at >10/>50/>100 MeV — solar radiation storms,
        the thing that threatens astronauts, polar flights and satellite parts.
      * GOES integral/differential electrons — surface and deep-dielectric
        charging risk for spacecraft.
      * DSCOVR/ACE real-time solar wind at L1 — density, speed, temperature and
        the interplanetary magnetic field including Bz, which is the single best
        ~30–60 minute lead indicator of a geomagnetic storm.
      * Planetary K index (1-minute estimated and 3-hourly), Kp forecast.
      * OVATION aurora nowcast grid, D-region absorption, 3-day forecast text.
      * Solar-cycle indices: sunspot number and F10.7 monthly back to 1749.
    endpoints:
      - id: alerts
        name: Issued alerts, watches and warnings
        url: https://services.swpc.noaa.gov/products/alerts.json
        expect: {min_items: {path: "", n: 5}}
        provides: product_id, issue_datetime, message (full NOAA alert text)
      - id: scales
        name: NOAA R/S/G scales, observed + 3-day forecast
        url: https://services.swpc.noaa.gov/products/noaa-scales.json
        expect: {min_bytes: 100}
        provides: per-day R, S, G scale value, text label, and prediction
      - id: kp_1m
        name: Planetary K index, 1-minute estimated
        url: https://services.swpc.noaa.gov/json/planetary_k_index_1m.json
        expect: {min_items: {path: "", n: 10}}
        provides: time_tag, kp_index, estimated_kp, kp string
      - id: xray_flux
        name: GOES X-ray flux, 1-day
        url: https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json
        expect: {min_items: {path: "", n: 10}}
        provides: time_tag, satellite, flux (W/m^2), energy band, observed_flux, electron_correction
      - id: protons
        name: GOES integral proton flux, 1-day
        url: https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json
        expect: {min_items: {path: "", n: 10}}
        provides: time_tag, satellite, flux (pfu), energy channel (>=10, >=50, >=100 MeV)
      - id: solar_wind_plasma
        name: DSCOVR real-time solar wind plasma (1 day)
        url: https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json
        expect: {min_items: {path: "", n: 10}}
        provides: time_tag, density (p/cm^3), speed (km/s), temperature (K)
      - id: solar_wind_mag
        name: DSCOVR real-time interplanetary magnetic field (1 day)
        url: https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json
        expect: {min_items: {path: "", n: 10}}
        provides: time_tag, bx_gsm, by_gsm, bz_gsm, bt, lon_gsm, lat_gsm
      - id: ovation
        name: OVATION aurora nowcast grid
        url: https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
        expect: {json_keys: [Observation Time, Forecast Time, coordinates]}
        provides: 1-degree lon/lat grid of aurora probability, observation and forecast time
      - id: forecast_3day
        name: 3-day space weather forecast (text product)
        url: https://services.swpc.noaa.gov/text/3-day-forecast.txt
        expect: {contains: ["NOAA"], min_bytes: 500}
        provides: human-readable 3-day Kp table, storm probabilities, rationale
      - id: solar_cycle
        name: Observed solar cycle indices
        url: https://services.swpc.noaa.gov/json/solar-cycle/observed-solar-cycle-indices.json
        expect: {min_items: {path: "", n: 100}}
        provides: time-tag, ssn, smoothed_ssn, observed_swpc_ssn, f10.7, smoothed_f10.7

  - id: nasa_donki
    name: NASA CCMC DONKI (Space Weather Database of Notifications, Knowledge, Information)
    org: NASA Goddard / Community Coordinated Modeling Center
    homepage: https://ccmc.gsfc.nasa.gov/tools/DONKI/
    domains: [solar, geomagnetic, radiation]
    auth: none
    formats: [json]
    cadence: hourly
    depth: years
    relevance: warning
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      Human-curated space-weather *events*, not raw instrument counts — which is
      what you need to build a timeline or a causal chain. Separate endpoints per
      event type: CME (time, source location, active region) and CME Analysis
      (measured speed, half-angle, latitude/longitude, type S/C/O/R/ER plus the
      WSA-ENLIL model run and its predicted Earth arrival time), solar flares
      (begin/peak/end, class, active region, linked events), geomagnetic storms
      (observed Kp series), solar energetic particle events, interplanetary
      shocks, magnetopause crossings, radiation-belt enhancements, and the
      notification texts themselves. Each event carries `linkedEvents`, so you
      can trace flare -> CME -> shock -> storm as one chain.
      Mirrored on api.nasa.gov (needs a key) and on the CCMC host (no key).
    endpoints:
      - id: ccmc_cme_analysis
        name: CME analyses (CCMC host, keyless)
        url: https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/CMEAnalysis
        params: {startDate: "2024-05-01", endDate: "2024-05-15", mostAccurateOnly: "true"}
        expect: {min_items: {path: "", n: 1}}
        provides: time21_5, latitude, longitude, halfAngle, speed, type, isMostAccurate, enlilList
      - id: ccmc_gst
        name: Geomagnetic storms (CCMC host, keyless)
        url: https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/GST
        params: {startDate: "2024-05-01", endDate: "2024-05-15"}
        expect: {min_items: {path: "", n: 1}}
        provides: gstID, startTime, allKpIndex (observedTime, kpIndex, source), linkedEvents
      - id: ccmc_flr
        name: Solar flares (CCMC host, keyless)
        url: https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/FLR
        params: {startDate: "2024-05-01", endDate: "2024-05-15"}
        expect: {min_items: {path: "", n: 1}}
        provides: flrID, beginTime, peakTime, endTime, classType, sourceLocation, activeRegionNum
      - id: ccmc_notifications
        name: Space-weather notifications (CCMC host, keyless)
        url: https://kauai.ccmc.gsfc.nasa.gov/DONKI/WS/get/notifications
        params: {startDate: "2024-05-01", endDate: "2024-05-15", type: all}
        expect: {min_items: {path: "", n: 1}}
        provides: messageType, messageID, messageIssueTime, messageBody
      - id: api_nasa_cme
        name: CME list via api.nasa.gov mirror
        url: https://api.nasa.gov/DONKI/CME
        params: {startDate: "2024-05-01", endDate: "2024-05-10"}
        api_key_param: api_key
        expect: {min_items: {path: "", n: 1}}
        provides: same DONKI CME records, keyed access, rate limited

  - id: gfz_kp
    name: GFZ Potsdam geomagnetic indices (Kp / ap / Hp30 / Hp60)
    org: GFZ German Research Centre for Geosciences
    homepage: https://kp.gfz.de/
    domains: [geomagnetic]
    auth: none
    formats: [json, text]
    cadence: hourly
    depth: decades
    relevance: driver
    uniqueness: sole
    license: CC BY 4.0
    provides: |
      The definitive Kp index — SWPC's Kp is an estimate, GFZ is the official
      producer. The web service returns Kp and ap at 3-hour cadence continuously
      from 1932, the international sunspot number and F10.7 on the same grid, and
      the newer high-cadence Hp30/Hp60 and ap30/ap60 indices which resolve storm
      substructure that 3-hourly Kp smears out. This is the series you use for
      any statistical or historical study of geomagnetic risk, and the definitive
      values that late-arriving corrections are applied to.
    endpoints:
      - id: kp_ws
        name: Kp index web service
        url: https://kp.gfz.de/app/json/
        params: {start: "2024-05-01T00:00:00Z", end: "2024-05-15T00:00:00Z", index: Kp, status: def}
        expect: {min_bytes: 200}
        provides: datetime array, Kp array, status (definitive/provisional)
      - id: kp_flatfile
        name: Kp/ap/Ap/SN/F10.7 since 1932 (flat file)
        url: https://kp.gfz.de/app/files/Kp_ap_Ap_SN_F107_since_1932.txt
        expect: {min_bytes: 500000}
        provides: full historical table, 3-hourly Kp and ap, daily Ap, sunspot number, F10.7

  - id: silso
    name: SILSO — World Data Center for the Sunspot Index
    org: Royal Observatory of Belgium
    homepage: https://www.sidc.be/SILSO/
    domains: [solar]
    auth: none
    formats: [csv, text]
    cadence: daily
    depth: decades
    relevance: driver
    uniqueness: sole
    license: CC BY-NC 4.0
    provides: |
      The official international sunspot number — the longest continuous record
      of solar activity, daily since 1818 and monthly since 1749, plus the
      13-month smoothed series, hemispheric split, the estimated (provisional)
      current-month value updated daily, and the official solar-cycle prediction.
      Sunspot number is the baseline against which "is this cycle dangerous"
      questions are answered, and it drives thermospheric-density models that
      determine satellite drag and debris lifetime.
    endpoints:
      - id: eisn
        name: Estimated international sunspot number, current month
        url: https://www.sidc.be/SILSO/DATA/EISN/EISN_current.csv
        expect: {min_bytes: 100}
        provides: year, month, day, decimal date, estimated SN, std dev, n stations
      - id: daily_total
        name: Daily total sunspot number since 1818
        url: https://www.sidc.be/SILSO/DATA/SN_d_tot_V2.0.csv
        expect: {min_bytes: 1000000}
        provides: date, daily SN, standard deviation, observations, definitive/provisional flag

  - id: lmsal_hek
    name: Heliophysics Event Knowledgebase (HEK)
    org: Lockheed Martin Solar & Astrophysics Lab / NASA
    homepage: https://www.lmsal.com/hek/
    domains: [solar]
    auth: none
    formats: [json]
    cadence: hourly
    depth: years
    relevance: driver
    uniqueness: few
    license: Open
    provides: |
      A searchable database of automatically and manually detected solar features
      and events across all major solar observatories: flares, filament
      eruptions, coronal holes, sigmoids, sunspots, emerging flux, CMEs and
      coronal dimmings. Each record carries start/peak/end times, heliographic
      bounding box and chain code, the detection algorithm, the instrument, GOES
      class where applicable, and links to the source data. Coronal-hole records
      are the practical way to anticipate recurrent high-speed-stream storms
      that have no flare or CME attached to them.
    endpoints:
      - id: her_flares
        name: Flare events from the HEK query interface
        url: https://www.lmsal.com/hek/her
        params:
          cosec: "2"
          cmd: search
          type: column
          event_type: "fl"
          event_starttime: "2024-05-08T00:00:00"
          event_endtime: "2024-05-12T00:00:00"
          event_coordsys: helioprojective
          x1: "-1200"
          x2: "1200"
          y1: "-1200"
          y2: "1200"
          result_limit: "10"
          return: "event_starttime,event_peaktime,fl_goescls,ar_noaanum,frm_name"
        expect: {json_keys: [result]}
        provides: event_starttime, event_peaktime, fl_goescls, ar_noaanum, frm_name, obs_instrument

  - id: helioviewer
    name: Helioviewer API
    org: NASA Goddard / ESA
    homepage: https://api.helioviewer.org/docs/v2/
    domains: [solar]
    auth: none
    formats: [json, binary]
    cadence: minutes
    depth: decades
    relevance: driver
    uniqueness: few
    license: Open
    provides: |
      Programmatic access to the full solar-imagery archive — SDO/AIA and HMI,
      SOHO/LASCO C2 and C3 coronagraphs, STEREO, PROBA-2, GOES/SUVI — from 1991
      to now. You can ask for the closest image to a timestamp, build composite
      layers, generate movies, and query the event layer. The LASCO coronagraph
      frames are how a halo CME is actually recognised as Earth-directed before
      any model runs, so this is the visual evidence layer behind a CME warning.
    endpoints:
      - id: status
        name: Data-source freshness
        url: https://api.helioviewer.org/v2/getStatus/
        expect: {min_bytes: 50}
        provides: per-observatory latest image time and staleness in seconds
      - id: closest_image
        name: Closest LASCO C3 image to a time
        url: https://api.helioviewer.org/v2/getClosestImage/
        params: {date: "2024-05-10T12:00:00Z", sourceId: "5"}
        expect: {min_bytes: 50}
        provides: image id, timestamp, scale, dimensions, instrument metadata

  - id: cdaweb_hapi
    name: NASA CDAWeb HAPI server
    org: NASA Goddard Space Physics Data Facility
    homepage: https://cdaweb.gsfc.nasa.gov/hapi
    domains: [solar, geomagnetic, radiation]
    auth: none
    formats: [json, csv]
    cadence: daily
    depth: decades
    relevance: driver
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      A standard HAPI (Heliophysics API) interface over roughly two thousand
      space-physics datasets: OMNI merged solar wind at 1-minute and 1-hour
      resolution back to 1963, ACE, Wind, DSCOVR, Cluster, THEMIS, Van Allen
      Probes particle and field data, GOES energetic particles, and magnetometer
      networks. Uniform request shape — /catalog, /info, /data with a time range
      and parameter list — returns CSV or JSON. This is the archive-quality
      counterpart to SWPC's real-time feed: worse latency, far better calibration
      and depth, and the only practical way to get decades of L1 solar wind.
    endpoints:
      - id: catalog
        name: Dataset catalog
        url: https://cdaweb.gsfc.nasa.gov/hapi/catalog
        expect: {json_keys: [HAPI, catalog]}
        provides: dataset ids and titles for every available collection
      - id: omni_data
        name: OMNI 1-hour solar wind sample
        url: https://cdaweb.gsfc.nasa.gov/hapi/data
        params:
          id: OMNI2_H0_MRG1HR
          parameters: "DST1800"
          time.min: "2024-05-09T00:00:00Z"
          time.max: "2024-05-12T00:00:00Z"
          format: csv
        expect: {min_bytes: 200}
        provides: time, Dst (and ~50 more parameters on request; HAPI requires them in dataset order)

  - id: lisird
    name: LASP Interactive Solar Irradiance Data Center (LISIRD)
    org: University of Colorado LASP
    homepage: https://lasp.colorado.edu/lisird/
    domains: [solar]
    auth: none
    formats: [json, csv]
    cadence: daily
    depth: decades
    relevance: driver
    uniqueness: few
    license: Open with attribution
    provides: |
      Solar irradiance and solar-index time series served through the LaTiS API:
      total solar irradiance composites back to 1978 and reconstructions back to
      1610, spectral irradiance from SORCE/TSIS, the Mg II core-to-wing index,
      and the adjusted and observed F10.7 radio flux from Penticton. F10.7 is the
      standard driver of every operational thermosphere-density model, so this
      feeds directly into satellite-drag and reentry-timing estimates.
    endpoints:
      - id: f107
        name: Penticton F10.7 solar radio flux
        url: https://lasp.colorado.edu/lisird/latis/dap/penticton_radio_flux.json
        query_raw: "time>=2024-05-01"
        expect: {min_bytes: 200}
        provides: time, adjusted_flux, observed_flux (10.7 cm, sfu)

  # -------------------------------------------- orbital objects, debris, reentry

  - id: celestrak
    name: CelesTrak
    org: CelesTrak / T.S. Kelso
    homepage: https://celestrak.org/
    domains: [debris, conjunctions, reentry, geomagnetic]
    auth: none
    formats: [json, csv, text]
    cadence: hourly
    depth: decades
    relevance: warning
    uniqueness: few
    license: Free, attribution requested
    provides: |
      The keyless front door to the US catalogue of tracked objects, and the one
      most projects actually build on:
      * GP element sets for ~28,000 tracked objects in TLE, 3LE, JSON, CSV or OMM
        format, grouped (active, starlink, last-30-days, cosmos-2251-debris,
        iridium-33-debris, ...) or queried by NORAD ID / name. Feed these to an
        SGP4 propagator and you have every satellite and debris position.
      * SATCAT — the object catalogue: international designator, launch date and
        site, object type, RCS size class, current orbital parameters, decay date
        for objects that have reentered, and operational status.
      * SOCRATES — twice-daily all-on-all conjunction screening of the public
        catalogue: object pairs, time of closest approach, minimum range,
        relative velocity, maximum probability of collision.
      * Space-weather CSV — historical and predicted Ap, Kp, F10.7 in exactly the
        form atmospheric-drag models want, which is what turns a TLE into a
        reentry-date estimate.
    endpoints:
      - id: gp_recent
        name: GP elements for objects launched in the last 30 days
        url: https://celestrak.org/NORAD/elements/gp.php
        params: {GROUP: last-30-days, FORMAT: json}
        expect: {min_items: {path: "", n: 1}}
        provides: OBJECT_NAME, NORAD_CAT_ID, EPOCH, MEAN_MOTION, ECCENTRICITY, INCLINATION, RA_OF_ASC_NODE, ARG_OF_PERICENTER, MEAN_ANOMALY, BSTAR
      - id: satcat
        name: Satellite catalogue (payloads, rocket bodies, debris)
        url: https://celestrak.org/satcat/records.php
        params: {GROUP: last-30-days, FORMAT: json}
        expect: {min_items: {path: "", n: 1}}
        provides: OBJECT_ID, OBJECT_TYPE, OPS_STATUS_CODE, OWNER, LAUNCH_DATE, LAUNCH_SITE, DECAY_DATE, PERIOD, APOGEE, PERIGEE, RCS
      - id: space_weather_csv
        name: Space-weather indices for drag modelling
        url: https://celestrak.org/SpaceData/SW-Last5Years.csv
        expect: {min_bytes: 100000}
        provides: date, Bartels rotation, Kp x8, Kp sum, ap x8, Ap, Cp, C9, ISN, F10.7 obs/adj/centred-81-day
      - id: socrates
        name: SOCRATES conjunction screening
        url: https://celestrak.org/SOCRATES/
        expect: {min_bytes: 2000}
        provides: satellite pair, TCA, minimum range (km), relative velocity, max collision probability

  - id: space_track
    name: Space-Track.org
    org: US Space Force / 18th & 19th Space Defense Squadron
    homepage: https://www.space-track.org/
    domains: [debris, conjunctions, reentry]
    auth: account
    formats: [json, csv, xml]
    cadence: hourly
    depth: decades
    relevance: warning
    uniqueness: sole
    license: Free account, redistribution restricted by user agreement
    provides: |
      The authoritative upstream. A free account unlocks data that exists
      nowhere else: the full GP and GP_HISTORY element catalogue including
      analyst objects, CDM_PUBLIC conjunction data messages for operators
      (miss distance, collision probability, covariance at TCA), the DECAY
      table and Tracking and Impact Prediction (TIP) messages giving predicted
      reentry time and ground footprint with an uncertainty window, boxscore
      statistics per country, and SATCAT change logs. Everything CelesTrak
      publishes is derived from here, minus the CDMs and TIPs.
      Access is by POST login to /ajaxauth/login followed by REST queries; the
      user agreement forbids bulk redistribution, so treat it as a private feed.
    creds_env: [SPACETRACK_USER, SPACETRACK_PASS]
    endpoints:
      - id: login_probe
        name: Service liveness (unauthenticated login endpoint)
        url: https://www.space-track.org/ajaxauth/login
        expect: {status: 200}
        provides: confirms the API host is reachable; real queries require credentials

  - id: esa_discos
    name: ESA DISCOSweb
    org: ESA Space Debris Office
    homepage: https://discosweb.esoc.esa.int/
    domains: [debris, reentry]
    auth: free_key
    formats: [json]
    cadence: daily
    depth: decades
    relevance: catalog
    uniqueness: sole
    license: Free token for non-commercial use
    provides: |
      Europe's Database and Information System Characterising Objects in Space:
      the physical-properties catalogue that the US catalogue lacks. Per object
      it gives mass, dimensions (span, height, depth), cross-section (minimum,
      maximum and average), shape, and construction materials; plus launch
      records, reentry epochs, fragmentation events with cause and resulting
      debris counts, and destination orbits. Mass and area are exactly what you
      need to convert "an object is reentering" into "how much survives to the
      ground" or to compute an area-to-mass ratio for drag. JSON:API over HTTPS
      with a bearer token.
    creds_env: [DISCOS_TOKEN]
    endpoints:
      - id: objects_unauth
        name: Objects endpoint without a token (expects rejection)
        url: https://discosweb.esoc.esa.int/api/objects
        expect: {status: 401}
        provides: confirms the API is live; real queries need a bearer token

  - id: aerospace_cords
    name: Aerospace Corporation CORDS reentry predictions
    org: The Aerospace Corporation
    homepage: https://aerospace.org/reentries
    domains: [reentry]
    auth: none
    formats: [html]
    cadence: daily
    depth: years
    relevance: warning
    uniqueness: few
    license: Public web content
    provides: |
      NOTE: verified as NOT programmatically accessible — the site sits behind a
      WAF that answers automated requests with HTTP 403 and a challenge page.
      Read it in a browser; do not plan a scraper around it. Its probe is left
      in place and left failing so the ranking reflects that.

      Independent, publicly readable reentry predictions for large uncontrolled
      objects: predicted reentry time with an uncertainty window, ground-track
      maps for the possible reentry passes, object mass and expected surviving
      debris, and post-event reconstructions. Where Space-Track's TIP messages
      are terse and access-controlled, CORDS is the public narrative layer,
      updated as the prediction tightens in the final days.
    endpoints:
      - id: reentries_page
        name: Reentry predictions index
        url: https://aerospace.org/reentries
        expect: {min_bytes: 2000}
        provides: object name, NORAD ID, predicted reentry window, uncertainty, status

  - id: gcat
    name: GCAT — Jonathan McDowell's General Catalog of Artificial Space Objects
    org: Jonathan C. McDowell (Harvard-Smithsonian CfA)
    homepage: https://planet4589.org/space/gcat/
    domains: [debris, reentry]
    auth: none
    formats: [text, csv]
    cadence: weekly
    depth: decades
    relevance: catalog
    uniqueness: sole
    license: CC BY 4.0
    provides: |
      A hand-curated, heavily cross-checked catalogue of everything launched
      since 1957 — objects, launches, launch vehicles, sites, organisations,
      reentries and deep-space probes — with the historical corrections and
      identity resolutions the official catalogues never made. It is the best
      source for provenance questions ("what object actually was this", "when
      did it really reenter", "which launch did this fragment come from") and
      for reentry statistics over the whole space age. Plain tab-delimited
      tables, trivially parsable.
    endpoints:
      - id: currentcat
        name: Current in-orbit catalogue
        url: https://planet4589.org/space/gcat/tsv/cat/satcat.tsv
        expect: {min_bytes: 100000}
        provides: JCAT id, satellite name, launch date, state, type, orbital class, mass, dimensions, status, reentry date

  # ------------------------------------------------- meteors, fireballs, impacts

  - id: ams_meteors
    name: American Meteor Society fireball reports
    org: American Meteor Society
    homepage: https://www.amsmeteors.org/fireballs/
    domains: [fireballs]
    auth: free_key
    formats: [json]
    cadence: realtime
    depth: years
    relevance: warning
    uniqueness: few
    license: Free API key for non-commercial use
    provides: |
      Crowd-sourced fireball sightings, usually within minutes of an event and
      often before any official detection is published. Each event aggregates
      eyewitness reports into a computed trajectory: start and end lat/lon and
      altitude, ground track, velocity, estimated magnitude, sound and
      fragmentation reports, and the individual report records. This is the
      fastest public signal that something just entered the atmosphere over a
      populated area, and it covers events too small for CNEOS sensors.
    creds_env: [AMS_API_KEY]
    endpoints:
      - id: open_api_probe
        name: Open API without a key (expects rejection or error payload)
        url: https://www.amsmeteors.org/members/api/open_api/get_events
        params: {year: "2024"}
        expect: {min_bytes: 10}
        provides: confirms the endpoint is live; real queries need api_key

  - id: gmn
    name: Global Meteor Network
    org: Global Meteor Network (open collaboration)
    homepage: https://globalmeteornetwork.org/
    domains: [fireballs]
    auth: none
    formats: [csv, text]
    cadence: daily
    depth: years
    relevance: driver
    uniqueness: sole
    license: CC BY 4.0
    provides: |
      A worldwide network of low-cost video meteor cameras publishing fully
      reduced, open trajectory data nightly: per-meteor radiant, geocentric and
      heliocentric velocity, orbital elements, absolute magnitude, mass estimate,
      begin and end height, and the observing stations that saw it. Aggregated
      daily and monthly files plus a live fireball page. It is the only open
      dataset that quantifies the small-impactor flux — the population between
      "harmless meteor" and "CNEOS-detectable bolide" — which is what a
      statistical risk model for small impacts needs.
    endpoints:
      - id: traj_summary
        name: Monthly trajectory summary files
        url: https://globalmeteornetwork.org/data/traj_summary_data/monthly/
        expect: {min_bytes: 500}
        provides: index of monthly CSVs with per-meteor orbits, radiants, velocities, magnitudes, masses

  # ------------------------------------------- high-energy transients & context

  - id: gcn
    name: GCN — General Coordinates Network
    org: NASA Goddard
    homepage: https://gcn.nasa.gov/
    domains: [transients]
    auth: none
    formats: [json, text, xml]
    cadence: realtime
    depth: decades
    relevance: tail_risk
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      The real-time alert bus for high-energy transients: gamma-ray bursts from
      Swift and Fermi, gravitational-wave candidates from LIGO/Virgo/KAGRA,
      high-energy neutrinos from IceCube, and magnetar giant flares. Notices
      carry the trigger time, localisation (position plus error radius or a
      HEALPix probability map), significance and classification, within seconds
      to minutes of the event; Circulars are the human follow-up record going
      back to 1997. Relevant to space hazards as the extreme tail — a nearby
      magnetar giant flare or GRB is the only astrophysical event that ionises
      Earth's atmosphere on human timescales — and as a source of realistic
      event-driven alert plumbing.
    endpoints:
      - id: circulars_index
        name: Circulars archive
        url: https://gcn.nasa.gov/circulars
        expect: {min_bytes: 1000}
        provides: circular number, subject, submitter, date, body (GRB/GW/neutrino follow-up reports)

  - id: heasarc_tap
    name: HEASARC Virtual Observatory TAP service
    org: NASA Goddard High Energy Astrophysics Science Archive
    homepage: https://heasarc.gsfc.nasa.gov/xamin/
    domains: [transients]
    auth: none
    formats: [xml, csv, json]
    cadence: daily
    depth: decades
    relevance: catalog
    uniqueness: few
    license: Public domain (US Government)
    provides: |
      ADQL/SQL access over hundreds of high-energy mission catalogues — the Swift
      and Fermi GRB tables, all-sky monitor light curves, source catalogues and
      observation logs. For hazard work it is the archive that turns a transient
      alert into a historical rate: how often a burst of a given fluence occurs,
      with what sky distribution. Standard IVOA TAP, so any VO client or a plain
      HTTP GET with a query string works.
    endpoints:
      - id: tap_tables
        name: TAP schema — available tables
        url: https://heasarc.gsfc.nasa.gov/xamin/vo/tap/tables
        expect: {min_bytes: 5000}
        provides: table names and column metadata for every HEASARC catalogue

  - id: nasa_eonet
    name: NASA EONET (Earth Observatory Natural Event Tracker)
    org: NASA Earth Observatory
    homepage: https://eonet.gsfc.nasa.gov/
    domains: [earth_effects]
    auth: none
    formats: [json]
    cadence: daily
    depth: years
    relevance: catalog
    uniqueness: few
    license: Public domain (US Government)
    provides: |
      A curated GeoJSON feed of ongoing natural events observed from orbit —
      wildfires, severe storms, volcanoes, dust and haze, icebergs, landslides.
      Not a space hazard itself, but the standard way to correlate a candidate
      space-related signature with a mundane terrestrial explanation, and a
      clean reference implementation of an event/category/geometry API.
    endpoints:
      - id: events
        name: Open events
        url: https://eonet.gsfc.nasa.gov/api/v3/events
        params: {limit: "10", status: open}
        expect: {json_keys: [title, events]}
        provides: event id, title, category, sources, geometry (point or polygon) with date

  - id: usgs_fdsn
    name: USGS Earthquake Catalog (FDSN event service)
    org: US Geological Survey
    homepage: https://earthquake.usgs.gov/fdsnws/event/1/
    domains: [earth_effects, fireballs]
    auth: none
    formats: [json, csv, xml]
    cadence: minutes
    depth: decades
    relevance: catalog
    uniqueness: few
    license: Public domain (US Government)
    provides: |
      Seismic and infrasound-adjacent event records with origin time, location,
      depth, magnitude and magnitude type, in GeoJSON. Large bolide airbursts
      register on seismic and infrasound networks, so this is a cross-check for
      confirming and geolocating an atmospheric impact independently of optical
      reports — the Chelyabinsk airburst appears in seismic records. Also the
      cleanest public example of an FDSN-standard query interface.
    endpoints:
      - id: query
        name: Recent significant events
        url: https://earthquake.usgs.gov/fdsnws/event/1/query
        params: {format: geojson, limit: "10", minmagnitude: "5", orderby: time}
        expect: {json_keys: [type, features, metadata]}
        provides: time, place, mag, magType, depth, coordinates, event type, felt reports

  - id: sscweb
    name: NASA Satellite Situation Center (SSCWeb)
    org: NASA Goddard Space Physics Data Facility
    homepage: https://sscweb.gsfc.nasa.gov/
    domains: [radiation, geomagnetic]
    auth: none
    formats: [json, xml]
    cadence: daily
    depth: decades
    relevance: catalog
    uniqueness: sole
    license: Public domain (US Government)
    provides: |
      Where a spacecraft is relative to the magnetosphere, not just relative to
      Earth: positions for hundreds of heliophysics missions in GEO, GSE, GSM and
      SM coordinates, plus magnetic-field-line tracing and region classification
      (magnetosheath, magnetotail, plasmasphere, radiation belt, bow shock and
      magnetopause crossings). For radiation-exposure and charging questions the
      magnetospheric region matters more than the altitude, and this is the only
      service that resolves it.
    endpoints:
      - id: observatories
        name: Available observatories
        url: https://sscweb.gsfc.nasa.gov/WS/sscr/2/observatories
        expect: {min_bytes: 1000}
        provides: spacecraft id, name, resolution, start and end time of available ephemeris

  - id: wheretheiss
    name: Where the ISS at? API
    org: Bill Shupp (independent)
    homepage: https://wheretheiss.at/w/developer
    domains: [debris]
    auth: none
    formats: [json]
    cadence: realtime
    depth: realtime_only
    relevance: catalog
    uniqueness: many
    license: Free, no key
    provides: |
      Instant SGP4-propagated position, velocity, altitude, footprint, solar
      illumination and ground-track lat/lon for any catalogued satellite by NORAD
      ID, plus TLE retrieval and timestamp-batch queries. No key, no rate limit
      worth worrying about. Useful as a zero-setup positional layer or a sanity
      check on your own propagator, but it is derived from public TLEs and adds
      no independent information.
    endpoints:
      - id: iss_now
        name: ISS position now
        url: https://api.wheretheiss.at/v1/satellites/25544
        expect: {json_keys: [latitude, longitude, altitude, velocity, timestamp]}
        provides: latitude, longitude, altitude, velocity, visibility, footprint, solar_lat, solar_lon, daynum
